name: daily-checkin

# 定时已移除：GitHub schedule 对低活跃仓库延迟数小时，深夜补跑只会发失败邮件骚扰。
# 日常打卡由本机 Windows 任务计划（20:05 / 21:15）执行。
# 本 workflow 保留 workflow_dispatch 仅供应急手动触发（电脑没开机时用）。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python checkin.py
        env:
          QBS_TOKEN: ${{ secrets.QBS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
