name: daily-checkin

on:
  schedule:
    # 北京时间 20:10 / 20:40 各跑一次（打卡窗口 20:00-22:30），
    # 已打过卡会自动跳过，双保险防 GitHub 定时延迟
    - cron: '10 12 * * *'
    - cron: '40 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python checkin.py
        env:
          QBS_TOKEN: ${{ secrets.QBS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
