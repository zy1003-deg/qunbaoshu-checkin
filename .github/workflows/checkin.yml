name: daily-checkin

on:
  schedule:
    # 北京时间 20:00-22:10 铺满 7 个触发点（打卡窗口 20:00-22:30）。
    # GitHub 定时在高峰期可能延迟甚至丢触发，多点冗余；已打过卡自动跳过。
    - cron: '0 12 * * *'
    - cron: '10 12 * * *'
    - cron: '25 12 * * *'
    - cron: '40 12 * * *'
    - cron: '10 13 * * *'
    - cron: '40 13 * * *'
    - cron: '10 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python checkin.py
        env:
          QBS_TOKEN: ${{ secrets.QBS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
